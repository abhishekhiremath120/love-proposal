<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Vaibhavi ❤️</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="proposal-container">
    <div class="proposal-card" id="proposalCard">
        <div class="big-heart">💗</div>
        <p class="for-text">For</p>
        <h1>{{ name }}</h1>
        <div class="question">{{ question }}</div>
        <div class="buttons">
            <button id="yesButton" class="yes-button">YES! 💖</button>
            <button id="noButton" class="no-button">NO 😢</button>
        </div>
    </div>

    <div class="success-card" id="successCard" style="display:none;">
        <div class="celebration">🎉 💕 🎉</div>
        <h1>She Said YES! 💖</h1>
        <p>Vaibhavi, you just made my heart the happiest. ❤️</p>
        <div class="big-love">❤️</div>
        <p class="forever">Forever starts now! 💍</p>
        <div class="celebration">💕 💕 💕</div>
    </div>
</div>
<script src="/static/js/proposal.js"></script>
</body>
</html>
